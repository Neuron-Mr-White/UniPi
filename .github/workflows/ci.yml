name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  lint-python:
    name: Lint Python (black, ruff, ty)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create venv and install tools
        run: |
          uv venv .venv
          uv pip install black ruff ty 'cocoindex[lancedb]'

      - name: Black (formatting)
        run: .venv/bin/black --check packages/cocoindex/pipeline-template.py

      - name: Ruff (linting)
        run: .venv/bin/ruff check packages/cocoindex/pipeline-template.py

      - name: ty (type checking)
        run: |
          .venv/bin/ty check packages/cocoindex/pipeline-template.py

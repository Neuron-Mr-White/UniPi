name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  kanboard-rust:
    name: Kanboard crate (web + test + clippy + UI checks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The binary embeds ui-dist (UNI-117: the UniPi app's web build). CI has
      # no unipi-app checkout, so this resolves to the pinned published build,
      # else the deprecated crates/kanboard/web UI — which tests/ui.mjs drives.
      - name: Build the board UI
        run: |
          npm --prefix crates/kanboard/web ci --no-audit --no-fund
          node crates/kanboard/scripts/build-ui.mjs --source legacy

      # rust-toolchain.toml pins 1.98.1 (Topcoat's MSRV).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kanboard

      - name: Test
        working-directory: crates/kanboard
        run: cargo test

      - name: Clippy
        working-directory: crates/kanboard
        run: cargo clippy --all-targets -- -D warnings

      # Drives the real board in headless Chrome over CDP: lanes at the left
      # edge, themed scrollbars, drag todo → backlog, the comment modal, the
      # detail panel, the new-task dialog and the theme toggle.
      - name: UI checks (headless chrome)
        run: |
          sudo apt-get update && sudo apt-get install -y chromium-browser || sudo snap install chromium
          node crates/kanboard/tests/ui.mjs

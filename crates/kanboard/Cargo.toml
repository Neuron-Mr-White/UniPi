[package]
name = "kanboard"
version = "3.0.0-alpha.0"
edition = "2024"
description = "unipi kanboard v3 — task format, transition rules, dependency graph and CLI"
license = "MIT"
authors = ["Neuron Mr White"]
repository = "https://github.com/Neuron-Mr-White/unipi"
keywords = ["kanboard", "unipi", "tasks"]
categories = ["command-line-utilities"]

[[bin]]
name = "unipi-kanboard"
path = "src/main.rs"

[lib]
name = "kanboard"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is archived/unmaintained upstream; serde_norway is the maintained fork.
serde_norway = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
# Pinned: Topcoat is early-stage (0.8.x) — only the non-asset feature set is used
# so the binary stays self-contained (see crates/kanboard/README.md).
topcoat = { version = "=0.8.1", default-features = false, features = ["router", "serve", "view", "sse", "discover"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
notify = "8"
base64 = "0.22"
getrandom = "0.3"
futures-util = "0.3"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
